[project]
name = "brain-mcp"
version = "0.1.0"
description = "Local-first MCP server with RAG for cross-project code knowledge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27.0",
    "fastembed>=0.8.0",
    "sqlite-vec>=0.1.9",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
brain = "brain_mcp.cli:main"
brain-mcp = "brain_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "N", "UP", "B", "A", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/brain_mcp"]

[[tool.mypy.overrides]]
module = "sqlite_vec"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-m 'not slow' --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: tests that require the real fastembed model (~70MB download)",
]
